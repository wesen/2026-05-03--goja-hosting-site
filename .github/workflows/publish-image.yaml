name: publish-image

on:
  pull_request:
    paths:
      - .github/workflows/publish-image.yaml
      - Dockerfile
      - go.mod
      - go.sum
      - cmd/**
      - pkg/**
      - sites/**
      - deploy/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-image.yaml
      - Dockerfile
      - go.mod
      - go.sum
      - cmd/**
      - pkg/**
      - sites/**
      - deploy/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: write
  id-token: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: go-go-golems/infra-tooling/.github/workflows/publish-ghcr-image.yml@main
    secrets: inherit
    with:
      dockerfile: ./Dockerfile
      build_context: .
      test_command: |
        mkdir -p ../corporate-headquarters
        git clone --depth 1 https://github.com/go-go-golems/go-go-goja ../corporate-headquarters/go-go-goja
        go test ./...
      go_version_file: go.mod
      gitops_target_config: deploy/gitops-targets.json
      push_image: ${{ github.event_name != 'pull_request' }}
      open_gitops_pr: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      gitops_pr_token_source: vault
      vault_role: goja-hosting-site-gitops-pr
      vault_secret_path: kv/data/ci/github/goja-hosting-site/gitops-pr-token
      tooling_repository: go-go-golems/infra-tooling
      tooling_ref: main
